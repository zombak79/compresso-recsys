[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compresso-recsys"
version = "0.3.0"
description = "Recommender-system experiments and checkpoint pipelines for Compresso"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Vojtech Vancura" },
    { name = "Giacomo Medda" },
    { name = "Martin Spisak" },
    { name = "Ladislav Peska" },
]
maintainers = [
    { name = "Vojtech Vancura" },
    { name = "Giacomo Medda" },
    { name = "Martin Spisak" },
    { name = "Ladislav Peska" },
]
keywords = [
    "recommender-systems",
    "recommendation",
    "retrieval",
    "collaborative-filtering",
    "cold-start",
    "datasets",
    "sparse-representations",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "compresso-pytorch>=0.1.3",
    "torch>=2.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
datasets = [
    "datasets>=2.19",
]
test = [
    "pytest>=8.0",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=4.0",
    # conf.py reads the version from pyproject rather than from installed
    # metadata, which can be stale. tomllib is stdlib from 3.11.
    "tomli>=2.0; python_version < '3.11'",
]
dev = [
    "build>=1.2",
    "twine>=6.0",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/zombak79/compresso-recsys"
Documentation = "https://zombak79.github.io/compresso-recsys/"
Repository = "https://github.com/zombak79/compresso-recsys"
Issues = "https://github.com/zombak79/compresso-recsys/issues"
Changelog = "https://github.com/zombak79/compresso-recsys/blob/main/CHANGELOG.md"

[project.scripts]
compresso-recsys-build-checkpoint = "compresso_recsys.scripts.build_checkpoint:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
