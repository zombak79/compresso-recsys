name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 3.13 runs ahead of support; its failures are reported but do not fail the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        experimental: [false]
        include:
          - python-version: "3.13"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only Torch: the default PyPI wheel ships CUDA and is several
          # hundred megabytes larger, which is the bulk of a cold install here.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]" pytest-socket pytest-cov

      - name: Run tests (offline, with coverage)
        # --disable-socket makes any network access fail the test, so the suite
        # never depends on GroupLens, Hugging Face or any other upstream host.
        # Unix sockets stay allowed for the multiprocessing used by the sweep tests.
        run: >
          pytest -x -q -o addopts="--tb=short"
          --disable-socket --allow-unix-socket
          --cov=compresso_recsys --cov-report=term
          --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff==0.16.8"
      - name: Pyflakes rules (enforced)
        run: ruff check --isolated --select F src tests examples
      - name: Full default rule set and formatting (report only)
        continue-on-error: true
        run: |
          ruff check src tests --statistics
          ruff format --check src tests
