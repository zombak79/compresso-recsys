name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem (synthetic data preferred).
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full traceback / output
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `python -c "import compresso_recsys, torch, sys; print(compresso_recsys.__file__, torch.__version__, sys.version)"` and `pip show compresso-recsys | grep Version`
    validations:
      required: true
