# Benchmark configuration of the ECIR 2027 resource paper (see README.md).
#
# Grids are written simplest first; selection on validation keeps the first of
# tied points. Trainers with `patience` stop early on the block's selection
# metric (max epochs + patience) and restore the best epoch. SASRec and
# BERT4Rec on ML-1M keep their published budgets (201 epochs; 400k steps =
# 907 epochs), as reproductions rather than tuned models.

[run]
seeds = [0, 1, 2]          # D6: three seeds for every stochastic model; deterministic models run once
eval_batch_size = 1024
note = "ECIR 2027 resource-track benchmark"

[paths]
checkpoints = "${CR_CKPT}"

[statistics]
n_resamples = 9999

# --------------------------------------------------------------------------- Block A
# Matrix CF, strong generalisation (Liang et al. 2018; Steck 2019): held-out users,
# 80/20 history/target split of each held-out user.

[blocks.A]
selection = "ndcg@100"
reference = "EASE"
datasets = { ml20m = { checkpoint = "ml20m-user_split.zip", table = "ml20m" }, netflix = { checkpoint = "netflix-user_split.zip", table = "netflix" } }

[blocks.A.models.Pop]
kind = "popularity"

[blocks.A.models.ItemKNN]
kind = "itemknn"
grid = { n_neighbors = [50, 100, 200], normalize_scores = [false, true] }
# ml20m selected k = 200, the top of the grid: one appended value (existing trials keep their
# numbers); a selection on the new edge is footnoted.
overrides = { ml20m = { grid = { n_neighbors = [50, 100, 200, 500] } } }

[blocks.A.models.EASE]
kind = "ease"
params = { dtype = "float64" }
grid = { l2 = [200, 500, 1000, 2000, 5000] }

[blocks.A.models.ELSA]
kind = "elsa"
grid = { latent_dim = [256, 1024] }
training = { max_epochs = 25, every = 1, patience = 3 }

[blocks.A.models.MultVAE]
kind = "multvae"
training = { max_epochs = 200, every = 5, patience = 4 }

# --------------------------------------------------------------------------- Block B
# Sequential, ML-1M leave-last-out, full-catalogue ranking.

[blocks.B]
selection = "ndcg@20"
reference = "EASE"
datasets = { "ml1m-llo" = { checkpoint = "ml1m-leave_last_out.zip", table = "ml1m-llo" } }

[blocks.B.models.Pop]
kind = "popularity"

[blocks.B.models.ItemKNN]
kind = "itemknn"
grid = { n_neighbors = [50, 100, 200], normalize_scores = [false, true] }
# ml1m-llo selected k = 50, the bottom of the grid: one appended value (existing trials keep their
# numbers); a selection on the new edge is footnoted.
overrides = { ml1m-llo = { grid = { n_neighbors = [50, 100, 200, 20] } } }

[blocks.B.models.EASE]
kind = "ease"
params = { dtype = "float64" }
grid = { l2 = [100, 200, 500, 1000] }

[blocks.B.models.ELSA]
kind = "elsa"
grid = { latent_dim = [256, 1024] }
training = { max_epochs = 25, every = 1, patience = 3 }

[blocks.B.models.MultVAE]
kind = "multvae"
training = { max_epochs = 200, every = 5, patience = 4 }

[blocks.B.models.SASRec]
kind = "sasrec"            # SASRecConfig() defaults are the published ML-1M configuration
training = { epochs = 201, every = 10 }   # fixed budget; validation is logged, not used to stop

[blocks.B.models.BERT4Rec]
kind = "bert4rec"
params = { max_predictions = 40 }
training = { target_steps = 400000 }      # Sun et al.: 400k steps = 907 epochs on this split

# --------------------------------------------------------------------------- Block B′
# Sequential, Amazon Reviews 2023 Toys_and_Games leave-last-out (Beauty-style settings).

[blocks.Bp]
selection = "ndcg@20"
reference = "EASE"
datasets = { amazon = { checkpoint = "amazon-toys-leave_last_out.zip", table = "amazon" } }

[blocks.Bp.models.Pop]
kind = "popularity"

[blocks.Bp.models.ItemKNN]
kind = "itemknn"
grid = { n_neighbors = [50, 100, 200], normalize_scores = [false, true] }

[blocks.Bp.models.EASE]
kind = "ease"
# 20 and 50 were appended (not prepended) after the first run selected 100, the
# grid's edge: appending keeps the earlier points' trial numbers and results.
grid = { l2 = [100, 200, 500, 1000, 50, 20] }

[blocks.Bp.models.ELSA]
kind = "elsa"
grid = { latent_dim = [256, 1024] }
training = { max_epochs = 25, every = 1, patience = 3 }

[blocks.Bp.models.MultVAE]
kind = "multvae"
# 400: at 200 the first run was still improving (best epochs 200, 180, 190).
training = { max_epochs = 400, every = 5, patience = 4 }

[blocks.Bp.models.SASRec]
kind = "sasrec"            # Kang & McAuley's Beauty settings: length 50, dropout 0.5
params = { max_history_length = 50, dropout = 0.5 }
training = { max_epochs = 200, every = 5, patience = 4 }

[blocks.Bp.models.BERT4Rec]
kind = "bert4rec"          # Sun et al.'s Beauty settings; BERT4Rec has no early-stopping hook
params = { max_history_length = 50, mask_proportion = 0.6, max_predictions = 30 }
training = { target_steps = 400000 }

# --------------------------------------------------------------------------- Block C
# Item cold start, ML-1M item split with the packaged SWAP features. Every model is
# scored in two catalogues from one fit: "cold" (the phase's cold items only) and
# "full" (every item; the targets are cold). Histories hold training items only.
# Reported in prose; TEASER is the reference because EASE cannot score cold items.

[blocks.C]
mode = "catalogue"
catalogues = ["cold", "full"]
selection = "ndcg@100"
selection_catalogue = "full"
reference = "TEASER"
datasets = { "ml1m-item" = { checkpoint = "ml1m-item_split-swap.zip", outputs = { cold = "table/ml1m-cold", full = "table/ml1m-full" } } }

[blocks.C.models.TEASER]
kind = "teaser"
# 5 and 20 added after the first run selected 1.0, the edge; 50 and 100 after the second
# selected 20 (through grid_extra, so no trial is renumbered). Then footnoted if needed.
grid = { features = [["text/mpnet"], ["image/vit_cls"]], l2 = [0.01, 0.05, 0.2, 1.0, 5.0, 20.0] }
grid_extra = [
  { features = ["text/mpnet"], l2 = 50.0 }, { features = ["text/mpnet"], l2 = 100.0 },
  { features = ["image/vit_cls"], l2 = 50.0 }, { features = ["image/vit_cls"], l2 = 100.0 },
]

[blocks.C.models.Content]
kind = "content"
grid = { features = [["text/minilm"], ["text/mpnet"], ["image/vit_cls"]] }

[blocks.C.models.MMConcat-TEASER]
kind = "teaser"
params = { features = ["text/mpnet", "image/vit_cls"] }
# 5 and 20 added after the first run selected 1.0, the edge; 50 and 100 after the second
# selected 20 (through grid_extra, so no trial is renumbered). Then footnoted if needed.
grid = { weights = [[1.0, 1.0], [1.0, 0.5]], l2 = [0.01, 0.05, 0.2, 1.0, 5.0, 20.0] }
grid_extra = [
  { weights = [1.0, 1.0], l2 = 50.0 }, { weights = [1.0, 1.0], l2 = 100.0 },
  { weights = [1.0, 0.5], l2 = 50.0 }, { weights = [1.0, 0.5], l2 = 100.0 },
]

[blocks.C.models.TEASER-GD]
kind = "teaser_gd"
# Trained, not reported, as in C′: it peaks at epoch 1 there and degrades while its loss falls.
report = false
params = { lr = 0.001 }
grid = { features = [["text/mpnet"], ["image/vit_cls"]] }
training = { max_epochs = 100, every = 1, patience = 10 }

[blocks.C.models.CLCRec]
kind = "clcrec"            # Wei et al. 2021 (MF encoder); same features as MMConcat-TEASER
params = { features = ["text/mpnet", "image/vit_cls"], temperature = 0.2 }
# λ and ρ trade warm against cold items. Full-catalogue validation peaks within a
# few epochs at the defaults, so the L2 weight η (gridded in the paper) is the lever.
# Extended after the first run selected the corner on all three axes (0.01, 0.7, 0.5),
# and once more after the second selected l2_weight 0.1 and re_weight 0.9:
# l2_weight 0.3 and 1.0 are appended to the first axis (new trials at the end), and
# re_weight 0.95 enters through grid_extra so no earlier trial is renumbered.
# re_weight 1.0 is left out: the user-item term would get zero weight and the user
# embeddings would never train. A selection on the new edge is footnoted.
grid = { l2_weight = [0.001, 0.01, 0.1, 0.3, 1.0], re_weight = [0.3, 0.5, 0.7, 0.9], hybrid_prob = [0.3, 0.5, 0.7] }
grid_extra = [
  { l2_weight = 0.001, re_weight = 0.95, hybrid_prob = 0.3 }, { l2_weight = 0.001, re_weight = 0.95, hybrid_prob = 0.5 }, { l2_weight = 0.001, re_weight = 0.95, hybrid_prob = 0.7 },
  { l2_weight = 0.01, re_weight = 0.95, hybrid_prob = 0.3 }, { l2_weight = 0.01, re_weight = 0.95, hybrid_prob = 0.5 }, { l2_weight = 0.01, re_weight = 0.95, hybrid_prob = 0.7 },
  { l2_weight = 0.1, re_weight = 0.95, hybrid_prob = 0.3 }, { l2_weight = 0.1, re_weight = 0.95, hybrid_prob = 0.5 }, { l2_weight = 0.1, re_weight = 0.95, hybrid_prob = 0.7 },
  { l2_weight = 0.3, re_weight = 0.95, hybrid_prob = 0.3 }, { l2_weight = 0.3, re_weight = 0.95, hybrid_prob = 0.5 }, { l2_weight = 0.3, re_weight = 0.95, hybrid_prob = 0.7 },
  { l2_weight = 1.0, re_weight = 0.95, hybrid_prob = 0.3 }, { l2_weight = 1.0, re_weight = 0.95, hybrid_prob = 0.5 }, { l2_weight = 1.0, re_weight = 0.95, hybrid_prob = 0.7 },
]
training = { max_epochs = 100, every = 1, patience = 10 }

[blocks.C.models.EASE]
kind = "ease"              # warm-only ceiling: a row in the full catalogue only
params = { dtype = "float64" }
grid = { l2 = [100, 200, 500, 1000] }

# --------------------------------------------------------------------------- Block C′
# Case study (D14): temporal splits with a mixed warm/cold catalogue. "warm" restricts
# candidates and targets to training items; "mixed" is the full stage catalogue.
# Item text is encoded once per dataset with `run.py encode`.

[blocks.Cp]
mode = "catalogue"
catalogues = ["warm", "mixed"]
selection = "ndcg@100"
selection_catalogue = "mixed"
reference = "EASE"
encoder = "sentence-transformers/all-MiniLM-L6-v2"
# Paired tests quoted in the text (summary/Cp/<dataset>.pairs.json), each its own Holm family.
pairs = [["Content", "TEASER"]]

[blocks.Cp.datasets.steam-temporal]
checkpoint = "steam-temporal.zip"
outputs = { warm = "casestudy/steam-temporal__warm", mixed = "casestudy/steam-temporal__mixed" }

[blocks.Cp.datasets.amazon-toys]
checkpoint = "amazon-toys-temporal.zip"
outputs = { warm = "casestudy/amazon-toys__warm", mixed = "casestudy/amazon-toys__mixed" }

[blocks.Cp.models.Pop]
kind = "popularity"

[blocks.Cp.models.EASE]
kind = "ease"
# 2000 and 5000 appended after the first run selected 1000, the grid's edge.
grid = { l2 = [100, 200, 500, 1000, 2000, 5000] }
# Steam selected 5000, the new edge, so it gets one last extension. If it selects
# the edge again the paper footnotes it ("selected at the grid edge; validation
# gains < 0.002"); there is no further extension.
overrides = { steam-temporal = { grid = { l2 = [100, 200, 500, 1000, 2000, 5000, 10000, 20000] } } }

[blocks.Cp.models.Content]
kind = "content"
params = { features = ["text"] }

[blocks.Cp.models.TEASER]
kind = "teaser"
params = { features = ["text"] }
# 5 and 20 appended after the first run selected 1.0, the grid's edge.
grid = { l2 = [0.01, 0.05, 0.2, 1.0, 5.0, 20.0] }
# Steam selected 20, the new edge: one last extension, as for EASE.
overrides = { steam-temporal = { grid = { l2 = [0.01, 0.05, 0.2, 1.0, 5.0, 20.0, 50.0, 100.0] } } }

[blocks.Cp.models.TEASER-GD]
kind = "teaser_gd"
# Not reported: validation peaks at epoch 1 and degrades while the loss falls,
# and neither probe below improves on it; closed-form TEASER is far better.
report = false
params = { features = ["text"], lr = 0.001 }
training = { max_epochs = 100, every = 1, patience = 10 }

# Probe (not reported): the first run's TEASER-GD peaked at epoch 1 and degraded
# while its loss fell. Two cells test a smaller step and TEASER's own objective.
[blocks.Cp.models.TEASER-GD-probe]
kind = "teaser_gd"
datasets = ["amazon-toys"]
report = false
params = { features = ["text"], lr = 0.0001 }
grid = { loss = ["normalized_mse", "teaser"] }
training = { max_epochs = 100, every = 1, patience = 10 }
